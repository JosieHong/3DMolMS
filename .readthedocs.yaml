version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"

python:
  install:
    # The package itself (hatchling backend) plus the docs toolchain from pyproject's
    # [docs] extra -- the single source of documentation dependencies.
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
